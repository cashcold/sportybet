name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web application
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL }}
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK Licenses & Install Platforms 35 and 36
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0" || true
          elif command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses || true
            sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0" || true
          fi

      - name: Prepare and Sync Capacitor Android
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "android/gradlew not found. Initializing Android native project from scratch..."
            rm -rf android
            npx cap add android
            sed -i 's/gradle-8.14.3-all.zip/gradle-8.14.3-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true
            sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle || true
            if ! grep -q "usesCleartextTraffic" android/app/src/main/AndroidManifest.xml 2>/dev/null; then
              sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml || true
            fi
          else
            echo "Existing Android native project detected in repository. Syncing web assets..."
            sed -i 's/gradle-8.14.3-all.zip/gradle-8.14.3-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true
            sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle || true
            npx cap sync android
          fi

      - name: Generate Android App Icons and Splash
        run: |
          npx @capacitor/assets generate --android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable and normalize line endings
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sportybet-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
